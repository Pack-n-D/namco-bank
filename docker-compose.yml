# ==============================================================================
# NAMCO BANK - PRODUCTION DOCKER COMPOSE ORCHESTRATION
# Single-command on-premise datacenter deployment
# Usage: docker compose up -d
# ==============================================================================
services:

  # ----------------------------------------------------------------------------
  # 1. APPLICATION BACKEND (Django REST Framework + Gunicorn + Tesseract OCR)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: namco_backend_app
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/app/deploy/docker-entrypoint.sh"]
    command: ["gunicorn", "namco_core.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "4", "--threads", "2", "--timeout", "60"]
    environment:
      - DEBUG=False
      - SQLITE_DB_PATH=/app/data/db.sqlite3
      - ALLOWED_HOSTS=127.0.0.1,localhost,consent.namcobank.in,app,nginx
      - CORS_ALLOWED_ORIGINS=http://127.0.0.1,http://localhost,https://consent.namcobank.in
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-namco-bank-onpremise-production-secret-2026}
      - BANK_ENCRYPTION_KEY=${BANK_ENCRYPTION_KEY:-namco-bank-storage-encryption-key-2026}
      - BANK_SMS_MOCK_MODE=${BANK_SMS_MOCK_MODE:-False}
      - BANK_SMS_GATEWAY_URL=${BANK_SMS_GATEWAY_URL:-http://10.10.5.40:8080/api/v1/sms/send}
      - BANK_SMS_API_KEY=${BANK_SMS_API_KEY:-NAMCO_INTERNAL_SECURE_TOKEN_2026}
      - BANK_SMS_SENDER_ID=${BANK_SMS_SENDER_ID:-NAMCOB}
      - BANK_SMS_DLT_ENTITY_ID=${BANK_SMS_DLT_ENTITY_ID:-1401157291823901234}
      - BANK_SMS_DLT_TEMPLATE_2FA=${BANK_SMS_DLT_TEMPLATE_2FA:-1407168291029384756}
      - BANK_SMS_DLT_TEMPLATE_ACK=${BANK_SMS_DLT_TEMPLATE_ACK:-1407168291029384757}
    volumes:
      - namco_data:/app/data
      - namco_media:/app/media
      - namco_static:/app/staticfiles
      - ./deploy/docker-entrypoint.sh:/app/deploy/docker-entrypoint.sh:ro
    networks:
      - namco_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/api/v1/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ----------------------------------------------------------------------------
  # 2. REVERSE PROXY & WEB GATEWAY (Nginx)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: namco_web_gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Serve frontend static application files (HTML, CSS, JS, Assets)
      - ./:/var/www/namco-bank:ro
      # Custom banking reverse proxy config
      - ./deploy/nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
      # Shared static & media volumes from app container
      - namco_static:/app/staticfiles:ro
      - namco_media:/app/media:ro
      # Optional: Bank SSL Wildcard Certificate mount directory
      - ./deploy/ssl:/etc/ssl/namcobank:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - namco_net

# ------------------------------------------------------------------------------
# PERSISTENT VOLUMES (Data preserved across container restarts & updates)
# ------------------------------------------------------------------------------
volumes:
  namco_data:
    name: namco_bank_data
  namco_media:
    name: namco_bank_media
  namco_static:
    name: namco_bank_static

# ------------------------------------------------------------------------------
# ISOLATED DOCKER BRIDGE NETWORK
# ------------------------------------------------------------------------------
networks:
  namco_net:
    name: namco_bank_network
    driver: bridge
