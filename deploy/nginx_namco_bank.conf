# ==============================================================================
# NAMCO BANK - PRODUCTION NGINX REVERSE PROXY CONFIGURATION
# Location on Server: /etc/nginx/sites-available/namco_consent.conf
# ==============================================================================

upstream django_consent_backend {
    server 127.0.0.1:8000 fail_timeout=0;
}

# 1. HTTP to HTTPS Redirection (Port 80 -> 443)
server {
    listen 80;
    listen [::]:80;
    server_name consent.namcobank.in;
    return 301 https://$host$request_uri;
}

# 2. Production HTTPS Banking Server (Port 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name consent.namcobank.in;

    # SSL TLS 1.2 / 1.3 Strict Ciphers (RBI Compliant)
    ssl_certificate /etc/ssl/namcobank/namcobank_wildcard.crt;
    ssl_certificate_key /etc/ssl/namcobank/namcobank_wildcard.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers (RBI Cyber Security Guidelines for Banks)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Root Directory for Web Application
    root /var/www/namco-bank;
    index index.html;

    # Maximum upload size for scanned physical OCR forms (15MB)
    client_max_body_size 15M;

    # A. Public Customer Consent Portal (Accessible to everyone)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Assets & Vendor Bundles (Cached locally, zero external CDN calls)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # B. REST API Forwarding to Django Backend — PUBLIC ENDPOINTS ONLY
    # These are the ONLY API routes accessible from the public internet
    location ~ ^/api/v1/(consent|customer|branches|$) {
        proxy_pass http://django_consent_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # C. RESTRICTED: Admin & SuperAdmin API Endpoints
    # Accessible ONLY from Namco Bank Branch Subnets & Head Office LAN
    location ~ ^/api/v1/(admin|superadmin)/ {
        # --- Whitelist Bank Subnets ---
        allow 10.0.0.0/8;       # Namco Bank Branch WAN / MPLS Subnets
        allow 172.16.0.0/12;    # Head Office & Admin LAN
        allow 192.168.1.0/24;   # Datacenter Internal Management
        allow 127.0.0.1;        # Localhost testing
        deny all;               # Block all public internet IP addresses with HTTP 403 Forbidden

        proxy_pass http://django_consent_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # D. RESTRICTED: Branch Officer & Super Admin HTML Portals
    # Accessible ONLY from Namco Bank Branch Subnets & Head Office LAN
    location ~* ^/(admin\.html|super-admin\.html|login\.html) {
        # --- Whitelist Bank Subnets ---
        allow 10.0.0.0/8;       # Namco Bank Branch WAN / MPLS Subnets
        allow 172.16.0.0/12;    # Head Office & Admin LAN
        allow 192.168.1.0/24;   # Datacenter Internal Management
        allow 127.0.0.1;        # Localhost testing
        deny all;               # Block all public internet IP addresses with HTTP 403 Forbidden

        try_files $uri =404;
    }

    # E. RESTRICTED: Django Native Admin Panel
    location /django-admin/ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.1.0/24;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://django_consent_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Deny access to sensitive files and hidden dot files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
