# ==============================================================================
# NAMCO BANK - DOCKER NGINX REVERSE PROXY CONFIGURATION
# Production-ready configuration for Docker Compose environment
# ==============================================================================

upstream django_backend {
    server app:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Security Headers (RBI Cyber Security Guidelines for Urban Co-op Banks)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Root Directory for Web Application Frontend
    root /var/www/namco-bank;
    index index.html;

    client_max_body_size 15M;

    # --------------------------------------------------------------------------
    # A. Public Customer Consent Portal (Accessible to everyone)
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------------------------------
    # B. Static Assets & Vendor Bundles (Cached locally, zero external CDN)
    # --------------------------------------------------------------------------
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Django Static Files (collected via collectstatic)
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # --------------------------------------------------------------------------
    # C. REST API Forwarding — PUBLIC ENDPOINTS ONLY
    # Only customer consent submission, status check, and branch directory
    # --------------------------------------------------------------------------
    location ~ ^/api/v1/(consent|customer|branches|$) {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # D. RESTRICTED: Branch Officer & SuperAdmin API Routes
    # Accessible ONLY from Namco Bank Branch Subnets & Head Office LAN
    # --------------------------------------------------------------------------
    location ~ ^/api/v1/(admin|superadmin)/ {
        # --- Whitelist Bank Subnets ---
        allow 10.0.0.0/8;       # Namco Bank Branch WAN / MPLS Subnets
        allow 172.16.0.0/12;    # Head Office & Admin LAN
        allow 192.168.1.0/24;   # Datacenter Internal Management
        allow 127.0.0.1;        # Localhost testing
        deny all;               # Block all external internet IPs with HTTP 403 Forbidden

        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # E. RESTRICTED: Branch Officer & Super Admin HTML Portals
    # Accessible ONLY from Namco Bank Branch Subnets & Head Office LAN
    # --------------------------------------------------------------------------
    location ~* ^/(admin\.html|super-admin\.html|login\.html) {
        # --- Whitelist Bank Subnets ---
        allow 10.0.0.0/8;       # Namco Bank Branch WAN / MPLS Subnets
        allow 172.16.0.0/12;    # Head Office & Admin LAN
        allow 192.168.1.0/24;   # Datacenter Internal Management
        allow 127.0.0.1;        # Localhost testing
        deny all;               # Block all external internet IPs with HTTP 403 Forbidden

        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # F. RESTRICTED: Django Native Admin Panel
    # --------------------------------------------------------------------------
    location /django-admin/ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.1.0/24;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Deny access to sensitive files and hidden dot files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
